baseURL = "https://blog.naveja.us/"
theme = "hugo-bearblog"

title = "Bridle Works"
author = "Aidan Naveja"
copyright = "Copyright © 2026, Aidan Naveja."
locale = "en-US"

enableRobotsTXT = true

# Bear Blog style URLs: no taxonomy pages, posts at /<slug>/.
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]
[permalinks]
  blog = "/:slug/"
  tags = "/blog/:slug"

[params]
  description = "The development blog of Bridle Works and AN0099: tools for running multi-agent work with a person in charge of it."
  title = "Bridle Works"
  dateFormat = "2006-01-02"
  images = ["images/share.png"]

# Feed author: name only, shown as <dc:creator> on each item. No email is
# published, so the feed has no managingEditor, webMaster or <author>.
[params.author]
  name = "Aidan Naveja"

# Every post goes in every feed (-1 is unlimited; set explicitly, see
# layouts/_default/rss.xml).
[services.rss]
  limit = -1
